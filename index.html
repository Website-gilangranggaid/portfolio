<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gilang Rangga | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Tag Audio Tersembunyi (Tanpa Tombol) -->
<audio autoplay loop id="bg-music">
    <source src="heat-waves.mp3" type="audio/mpeg">
</audio>

<!-- Script Pemicu Autoplay (Solusi Kebijakan Browser) -->
<script>
    window.addEventListener('click', function() {
        const audio = document.getElementById('bg-music');
        if (audio.paused) {
            audio.play();
        }
    }, { once: true }); // Hanya berjalan satu kali saat klik pertama
</script>
  </body>
</html>
